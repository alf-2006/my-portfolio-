<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F4F1EA;
            --text-color: #14110F;
            --accent-color: #C8412B;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Geist", sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .container {
            padding: 8vw 5vw;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 4rem;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        h1 {
            font-family: "Instrument Serif", serif;
            font-size: clamp(4rem, 10vw, 9rem);
            font-weight: 400;
            line-height: 0.95;
            letter-spacing: -0.02em;
            margin: 0 0 2.5rem 0;
        }

        p {
            font-size: 1.125rem;
            line-height: 1.6;
            max-width: 420px;
            margin: 0 0 3.5rem 0;
            opacity: 0.85;
        }

        .notify-form {
            display: flex;
            gap: 1rem;
            width: 100%;
            max-width: 420px;
            border-bottom: 1px solid var(--text-color);
            padding-bottom: 0.75rem;
        }

        input {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-family: "Geist", sans-serif;
            font-size: 1rem;
            flex-grow: 1;
            outline: none;
            padding: 0;
        }

        input::placeholder {
            color: var(--text-color);
            opacity: 0.4;
        }

        button {
            background: transparent;
            border: none;
            color: var(--accent-color);
            font-family: "Geist", sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0;
            transition: opacity 150ms ease;
        }

        button:hover {
            opacity: 0.6;
        }

        .visual-area {
            position: relative;
            border-left: 1px solid rgba(20, 17, 15, 0.1);
            display: flex;
            align-items: flex-end;
            padding-left: 4vw;
        }

        .accent-mark {
            width: 48px;
            height: 48px;
            background-color: var(--accent-color);
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                padding: 12vw 6vw;
            }
            .visual-area {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <h1>Coming soon.</h1>
            <p>We are refining the next iteration. Enter your email to be notified upon publication.</p>
            <form class="notify-form" onsubmit="event.preventDefault();">
                <input type="email" placeholder="Email address" required>
                <button type="submit">Subscribe</button>
            </form>
        </div>
        <div class="visual-area">
            <div class="accent-mark"></div>
        </div>
    </div>
</body>
</html>
